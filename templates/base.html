<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClinicQ{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --cq-primary: #0f766e;
      --cq-primary-dark: #115e59;
      --cq-accent: #0e7490;
      --cq-background: #eef7f6;
      --cq-text: #1f2937;
    }

    html, body {
      background: var(--cq-background);
      color: var(--cq-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top bar (SYS-02: wraps cleanly on narrow 360px phone screens) */
    .cq-navbar {
      background: linear-gradient(90deg, var(--cq-primary), var(--cq-accent));
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
    }
    .cq-navbar .container {
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .cq-navbar .navbar-brand {
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .cq-navbar .navbar-brand::before {
      content: "+";
      display: inline-block;
      width: 1.6rem;
      height: 1.6rem;
      margin-right: 0.5rem;
      line-height: 1.6rem;
      text-align: center;
      border-radius: 50%;
      background: #ffffff;
      color: var(--cq-primary);
      font-weight: 800;
    }

    /* Page card */
    .cq-card {
      background: #ffffff;
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 4px 18px rgba(15, 118, 110, 0.12);
      padding: 2rem;
      overflow-x: auto;
    }
    .cq-card h1 {
      color: var(--cq-primary-dark);
      font-weight: 700;
    }

    /* Buttons: COMP-02 & SYS-02 require touch targets of at least 44x44 px */
    .btn, .btn-sm {
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      --bs-btn-bg: var(--cq-primary);
      --bs-btn-border-color: var(--cq-primary);
      --bs-btn-hover-bg: var(--cq-primary-dark);
      --bs-btn-hover-border-color: var(--cq-primary-dark);
      --bs-btn-active-bg: var(--cq-primary-dark);
      --bs-btn-active-border-color: var(--cq-primary-dark);
      --bs-btn-disabled-bg: var(--cq-primary);
      --bs-btn-disabled-border-color: var(--cq-primary);
      border-radius: 0.6rem;
      padding: 0.55rem 1.3rem;
      font-weight: 600;
    }
    .btn-outline-danger, .btn-outline-light, .btn-outline-secondary {
      border-radius: 0.6rem;
    }
    a { color: var(--cq-primary); }

    /* Form spacing: every field is a div with a label and an input */
    main form > div {
      margin-bottom: 1.25rem;
    }
    main form label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    main form input[type="text"],
    main form input[type="email"],
    main form input[type="password"],
    main form input[type="number"],
    main form input[type="time"],
    main form input[type="date"],
    main form select,
    main form textarea {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 0.6rem 0.85rem;
      font-size: 1rem;
      color: var(--cq-text);
      background: #ffffff;
      border: 1px solid #b7c9c7;
      border-radius: 0.6rem;
    }
    main form input:focus,
    main form select:focus,
    main form textarea:focus {
      outline: 0;
      border-color: var(--cq-primary);
      box-shadow: 0 0 0 0.25rem rgba(15, 118, 110, 0.2);
    }
    main form .helptext {
      margin-bottom: 0.4rem;
      font-size: 0.875rem;
      color: #5b6b6a;
    }
    main form .errorlist {
      list-style: none;
      margin: 0 0 0.5rem;
      padding: 0.5rem 0.85rem;
      color: #842029;
      background: #f8d7da;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }
    main form [aria-invalid="true"] {
      border-color: #dc3545;
    }

    /* Tables scroll inside their own box on narrow phone screens (SYS-02) */
    .table-responsive, .cq-table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table {
      display: block;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 576px) {
      .table {
        display: table;
      }
    }
    .table > :not(caption) > * > * { padding: 0.75rem 0.6rem; }
    .table thead th {
      color: var(--cq-primary-dark);
      border-bottom: 2px solid var(--cq-primary);
    }

    /* Narrow phone screen rules (360px minimum width per COMP-02 / SYS-02) */
    @media (max-width: 575.98px) {
      .cq-card {
        padding: 1.15rem;
        border-radius: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark cq-navbar mb-4">
    <div class="container">
      <div class="d-flex align-items-center flex-wrap gap-3">
        <a class="navbar-brand m-0" href="{% url 'accounts:home' %}">ClinicQ</a>
        <a class="text-white text-decoration-none py-2" href="{% url 'booking:doctor_search' %}">Find a doctor</a>
      </div>

      {% if user.is_authenticated %}
        <form method="post" action="{% url 'accounts:logout' %}" class="d-flex align-items-center flex-wrap gap-2 m-0">
          {% csrf_token %}
          <span class="text-white">{{ user.username }} ({{ user.get_role_display }})</span>
          <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
        </form>
      {% endif %}
    </div>
  </nav>
  <main class="container pb-5" style="max-width: 760px;">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}
    <div class="cq-card">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
