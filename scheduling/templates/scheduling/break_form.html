{% extends "base.html" %}
{% block title %}Add a break - ClinicQ{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Add a break</h1>
  <p>Session: <strong>{{ rule }}</strong>. Patients cannot book slots that fall inside a break.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary mt-3">Save break</button>
    <a class="btn btn-link mt-3" href="{% url 'scheduling:availability' %}">Cancel</a>
  </form>
{% endblock %}
