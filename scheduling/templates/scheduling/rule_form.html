{% extends "base.html" %}
{% block title %}Add a session - ClinicQ{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Add a weekly session</h1>
  <p>For example: Monday, 17:00 to 21:00, 15-minute slots. This repeats every week.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary mt-3">Save session</button>
    <a class="btn btn-link mt-3" href="{% url 'scheduling:availability' %}">Cancel</a>
  </form>
{% endblock %}
