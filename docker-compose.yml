services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinicq
      POSTGRES_USER: clinicq
      POSTGRES_PASSWORD: clinicq
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
volumes:
  pgdata: