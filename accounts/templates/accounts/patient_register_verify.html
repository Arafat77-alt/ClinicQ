{% extends "base.html" %}
{% block title %}Verify mobile number - ClinicQ{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Enter your verification code</h1>
  <p>We sent a 6-digit code to <strong>{{ mobile_number }}</strong>.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary mt-3">Verify and create account</button>
  </form>
  <p class="mt-3 mb-0">
    Did not get a code or entered the wrong number?
    <a href="{% url 'accounts:patient_register' %}">Start again</a>
  </p>
{% endblock %}
