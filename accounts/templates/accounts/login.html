{% extends "base.html" %}
{% block title %}Log in - ClinicQ{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Staff log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary mt-3">Log in</button>
  </form>
  <p class="mt-3 mb-2"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
  <hr>
  <p class="mb-0">
    Are you a patient?
    <a href="{% url 'accounts:patient_login' %}">Log in with a mobile code</a> or
    <a href="{% url 'accounts:patient_register' %}">register a new account</a>.
  </p>
{% endblock %}
