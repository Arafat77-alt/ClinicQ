name: ClinicQ Automated Checks (Tests & Style)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Run Ruff tidy-code checker (MAIN-03)
        run: ruff check .
